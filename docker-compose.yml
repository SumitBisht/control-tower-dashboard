services:
  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
    ports: ["27017:27017"]
  backend:
    build: ./backend
    # App settings (CLIENT_NAME, ADMIN_*, JWT_SECRET, limits...) come from backend/.env - one file for local and Docker.
    # Only values that differ inside Docker are set below (they override the file).
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      MONGODB_URI: mongodb://mongo:27017
      STORAGE_LOCAL_DIR: /srv/storage
      CORS_ORIGINS: '["http://localhost:8080"]'
    volumes: [uploads:/srv/storage]
    depends_on: [mongo]
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]
volumes:
  mongo_data:
  uploads:
